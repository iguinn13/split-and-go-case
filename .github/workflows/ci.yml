name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: splitgo
          POSTGRES_PASSWORD: splitgo
          POSTGRES_DB: splitgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitgo -d splitgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitgo:splitgo@localhost:5432/splitgo
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint needs the generated Prisma client types.
      - name: Generate Prisma client
        run: pnpm --filter @split-and-go/api exec prisma generate
      - name: Apply database migrations
        run: pnpm --filter @split-and-go/api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_EXTERNAL_STACK: '1'
      E2E_COMPOSE_PROJECT: splitgo-e2e
      WEB_PORT: '13000'
      API_PORT: '13001'
      POSTGRES_PORT: '15432'
      CORS_ORIGIN: http://localhost:13000
      JWT_SECRET: ci-e2e-only-secret
      COMPOSE: >-
        docker compose -p splitgo-e2e -f docker-compose.yml -f apps/web/e2e/docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @split-and-go/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @split-and-go/web exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @split-and-go/web exec playwright install-deps chromium
      - name: Start the Docker Compose stack
        run: $COMPOSE up -d --build --wait
      - name: Run Playwright tests
        run: pnpm --filter @split-and-go/web test:e2e
      - name: Show container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Tear down the stack
        if: always()
        run: $COMPOSE down -v --remove-orphans
