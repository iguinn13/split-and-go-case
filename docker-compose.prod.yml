# Production stack (single host). Only nginx publishes ports (80/443).
# Usage: see docs/engineering/deployment.md. Variables come from the untracked `.env`
# (template: .env.production.example).
name: splitandgo

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-splitgo}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:-splitgo}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        environment:
            NODE_ENV: production
            PORT: 3001
            DATABASE_URL: postgresql://${POSTGRES_USER:-splitgo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-splitgo}
            JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
            CORS_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
            FX_PROVIDER_URL: ${FX_PROVIDER_URL:-https://api.frankfurter.dev/v1}
        # The image CMD runs `prisma migrate deploy` before starting the server,
        # so migrations are applied on every release before the API accepts traffic.
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        environment:
            API_URL: http://api:3001
            # nginx overwrites X-Forwarded-Host, so it is safe to trust it here.
            WEB_TRUST_FORWARDED_HOST: '1'
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 15s
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        environment:
            DOMAIN: ${DOMAIN}
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./deploy/nginx/templates:/etc/nginx/templates:ro
            - certbot-conf:/etc/letsencrypt:ro
            - certbot-www:/var/www/certbot:ro
        # Reload periodically so renewed certificates are picked up.
        command:
            - /bin/sh
            - -c
            - "(while :; do sleep 6h; nginx -s reload; done) & exec nginx -g 'daemon off;'"
        depends_on:
            web:
                condition: service_healthy
        restart: unless-stopped

    certbot:
        image: certbot/certbot:latest
        volumes:
            - certbot-conf:/etc/letsencrypt
            - certbot-www:/var/www/certbot
        entrypoint:
            - /bin/sh
            - -c
            - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
        restart: unless-stopped

volumes:
    postgres-data:
    certbot-conf:
    certbot-www:
