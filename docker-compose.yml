services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-splitgo}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitgo}
            POSTGRES_DB: ${POSTGRES_DB:-splitgo}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        environment:
            NODE_ENV: production
            PORT: 3001
            DATABASE_URL: postgresql://${POSTGRES_USER:-splitgo}:${POSTGRES_PASSWORD:-splitgo}@postgres:5432/${POSTGRES_DB:-splitgo}
            JWT_SECRET: ${JWT_SECRET:-change-me-in-development-only}
            CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
            FX_PROVIDER_URL: ${FX_PROVIDER_URL:-https://api.frankfurter.dev/v1}
        ports:
            - '${API_PORT:-3001}:3001'
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        environment:
            # Server-side only: the web container reaches the API over the compose network.
            API_URL: http://api:3001
            WEB_TRUST_FORWARDED_HOST: ${WEB_TRUST_FORWARDED_HOST:-}
        ports:
            - '${WEB_PORT:-3000}:3000'
        depends_on:
            - api
        restart: unless-stopped

volumes:
    postgres-data:
